name: togavsu

services:
  bootstrap:
    image: postgres:17
    user: "0"
    environment:
      TOGAVSU_DOMAIN: ${TOGAVSU_DOMAIN:-localhost}
    entrypoint: ["/bin/sh", "/bootstrap-secrets.sh"]
    volumes:
      - ./deploy/bootstrap/bootstrap-secrets.sh:/bootstrap-secrets.sh:ro
      - pgsecrets:/pgsecrets
      - appsecrets:/appsecrets
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: togavsu
      POSTGRES_DB: togavsu
      POSTGRES_PASSWORD_FILE: /pgsecrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsecrets:/pgsecrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togavsu -d togavsu"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dbinit:
    # Creates the core's non-superuser login role on every up; see deploy/postgres/core-role.sh.
    image: postgres:17
    entrypoint: ["/bin/sh", "/core-role.sh"]
    volumes:
      - ./deploy/postgres/core-role.sh:/core-role.sh:ro
      - pgsecrets:/pgsecrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    # Applies the core migrations as togavsu_app and seals the append-only tables to the
    # NOLOGIN togavsu_ledger_owner as the superuser (core migrate, core.MigrateSealed).
    # Only this one-shot is handed the superuser URL; the serving core logs in as togavsu_app.
    # Same build as core, so a first up builds the image once and both use it. The label
    # replaces the image's togavsu.role=core, so the supervisor never takes this exited
    # one-shot for the core container.
    labels:
      togavsu.role: migrate
    build:
      context: .
      dockerfile: deploy/core.Dockerfile
    image: togavsu-core:local
    user: "65532:65532"
    command: ["migrate"]
    environment:
      TOGAVSU_DOMAIN: ${TOGAVSU_DOMAIN:-localhost}
    volumes:
      - appsecrets:/appsecrets:ro
    depends_on:
      dbinit:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

  caddy:
    # ponytail: root so the alpine entrypoint can read the upstream file and write certificates, ceiling: root on the edge container, upgrade: a non-root entrypoint image, trigger: phase 7 release hardening.
    image: caddy:2-alpine
    user: "0"
    ports:
      - "80:80"
      - "443:443"
    environment:
      CORE_UPSTREAM: core:8080
      TOGAVSU_DOMAIN: ${TOGAVSU_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_admin:/run/caddy-admin
      - runtime:/runtime
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    image: togavsu-supervisor:local
    environment:
      SUPERVISOR_TOKEN_FILE: /appsecrets/supervisor_token
      SUPERVISOR_LISTEN: ":8081"
      SUPERVISOR_DATA: /var/lib/togavsu
      BACKUP_DIR: /var/lib/togavsu/backups
      BACKUP_PASSPHRASE_FILE: /appsecrets/backup_passphrase
      FIELD_KEY_FILE: /appsecrets/field_key
      DATABASE_URL_FILE: /appsecrets/database_url
      ADMIN_DATABASE_URL_FILE: /appsecrets/admin_database_url
      TOGAVSU_DOMAIN: ${TOGAVSU_DOMAIN:-localhost}
      CADDY_ADMIN_SOCKET: /run/caddy-admin/admin.sock
      UPSTREAM_FILE: /runtime/upstream
      DOCKER_SOCKET: /var/run/docker.sock
      TOGAVSU_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-togavsu}_default
      TOGAVSU_APPSECRETS_VOLUME: ${COMPOSE_PROJECT_NAME:-togavsu}_appsecrets
      TOGAVSU_CORE_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-togavsu}_core_data
      FIRM_TIMEZONE: UTC
      COSIGN_KEY: /appsecrets/cosign.pub
    volumes:
      - appsecrets:/appsecrets:ro
      - backups:/var/lib/togavsu/backups
      - supervisor_data:/var/lib/togavsu
      - runtime:/runtime
      - caddy_admin:/run/caddy-admin
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/supervisor", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # The core migrates, seeds reference rows and serves first-run setup on :8080 behind
  # Caddy. It logs in as togavsu_app (dbinit), not the Postgres superuser.
  # togavsu.role=core is how the supervisor finds this container.
  core:
    labels:
      togavsu.role: core
    build:
      context: .
      dockerfile: deploy/core.Dockerfile
    image: togavsu-core:local
    user: "65532:65532"
    environment:
      TOGAVSU_DOMAIN: ${TOGAVSU_DOMAIN:-localhost}
      SUPERVISOR_URL: http://supervisor:8081
    volumes:
      - appsecrets:/appsecrets
      # Upload staging and the default local-disk file store (core.DataDir). The
      # supervisor mounts the same volume on a replacement core.
      - core_data:/var/lib/togavsu-core
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  pgdata:
  pgsecrets:
  appsecrets:
  caddy_data:
  caddy_admin:
  runtime:
  backups:
  supervisor_data:
  core_data:
