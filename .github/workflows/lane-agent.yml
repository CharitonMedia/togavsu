name: Lane agent
run-name: Lane ${{ inputs.run_id }}
# One Togavsu implementation run, dispatched only by the build controller. Claude Code runs
# headless on the Max subscription in this GitHub-hosted VM. The job token is read-only: the
# controller verifies the returned git bundle and pushes it itself, so protected CI and the
# review gate run on every published revision.
on:
  workflow_dispatch:
    inputs:
      agent_id:
        required: true
        type: string
      run_id:
        required: true
        type: string
      task:
        required: true
        type: string
      branch:
        required: true
        type: string
      base:
        required: true
        type: string
      prompt_z:
        description: zlib-compressed, base64-encoded assignment prompt
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: read
concurrency:
  group: lane-${{ inputs.agent_id }}
  cancel-in-progress: false
jobs:
  lane:
    name: Lane agent
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LANE_AGENT: ${{ inputs.agent_id }}
      LANE_RUN: ${{ inputs.run_id }}
      LANE_TASK: ${{ inputs.task }}
      LANE_BRANCH: ${{ inputs.branch }}
      LANE_BASE: ${{ inputs.base }}
    steps:
      - name: Validate dispatch
        run: |
          python3 - <<'PY'
          import os, re, sys
          rules = {"LANE_AGENT": r"bc-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
                   "LANE_RUN": r"run-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
                   "LANE_TASK": r"[a-z0-9][a-z0-9-]{0,40}", "LANE_BRANCH": r"claude/togavsu-[a-z0-9-]{1,60}",
                   "LANE_BASE": r"[0-9a-f]{40}"}
          bad = [k for k, rule in rules.items() if not re.fullmatch(rule, os.environ.get(k, ""))]
          if bad or os.environ["GITHUB_ACTOR"] != "pattalkslaw-del":
              sys.exit("Rejected dispatch: " + ", ".join(bad or ["actor"]))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Install Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.317
      - name: Prepare assignment
        env:
          PROMPT_Z: ${{ inputs.prompt_z }}
        run: |
          git switch --quiet -c lane
          git config user.name "Togavsu lane agent"
          git config user.email "lane-agent@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/lane-out"
          python3 - <<'PY'
          import base64, os, pathlib, zlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lane-out"
          assignment = zlib.decompress(base64.b64decode(os.environ["PROMPT_Z"])).decode()
          preamble = f"""You are the Togavsu implementation worker for assignment {os.environ['LANE_TASK']}.
          You run Claude Code headless in an isolated GitHub-hosted VM on local branch `lane`, checked out at
          {os.environ['LANE_BASE']}. Go, Node, Python and Docker are available; use Docker for Postgres and
          synthetic data only. This VM has a read-only GitHub token: you cannot push, open or edit pull
          requests, and must not try. Commit all finished work to the current local branch with clear messages
          and explicit paths. The build controller publishes your commits to {os.environ['LANE_BRANCH']} and opens
          or updates its pull request. Before you finish, write the PR title (one line) to
          {out}/pr-title.txt and the complete current PR body to {out}/pr-body.md. The body replaces the
          previous one, so it must carry all current evidence AGENTS.md and docs/build/WORKFLOW.md require:
          the tested code revision, test commands and results, and honest pending criteria. If a PR already
          exists, start from its body (gh pr view {os.environ['LANE_BRANCH']} --json body). Wherever the assignment
          asks for a pushed commit SHA, report your final local commit SHA. Never write credentials, tokens
          or environment values into files, commits or the PR body. The controller rejects the whole result if
          any commit touches a control-plane file (AGENTS.md, scripts/build_controller.py, docs/build/ plan and
          task files, deploy/controller/), adds a symlink or submodule, or changes anything under .github/,
          including CI workflows your assignment owns. If CI needs a new or changed job, put the exact
          workflow change in the PR body under "Proposed CI change"; the integration lead lands it through a
          reviewed control PR.

          """
          (out / "prompt.md").write_text(preamble + assignment)
          PY
      - name: Run assignment
        id: claude
        continue-on-error: true
        timeout-minutes: 270  # Below the job limit, so packaging always keeps committed work.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          claude -p --model opus --dangerously-skip-permissions --max-turns 600 --output-format json \
            < "$RUNNER_TEMP/lane-out/prompt.md" > "$RUNNER_TEMP/lane-claude.json"
      - name: Package result
        env:
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          SECRET_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SECRET_GITHUB: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, sys
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          out, pack = temp / "lane-out", temp / "lane-pack"
          pack.mkdir()
          def raw(*args, data=None, env=None):
              return subprocess.run(["git"] + list(args), check=True, capture_output=True, input=data,
                                    env=dict(os.environ, **(env or {}))).stdout
          def git(*args, env=None):
              # Lanes may commit binary files (screenshots); undecodable bytes become U+FFFD so the scan still sees ASCII tokens.
              return raw(*args, env=env).decode("utf-8", "replace").strip()
          base, head = os.environ["LANE_BASE"], git("rev-parse", "refs/heads/lane")
          if git("merge-base", base, head) != base:
              sys.exit("Lane head does not descend from its base")
          uncommitted = bool(git("status", "--porcelain"))
          read = lambda name: (out / name).read_text(errors="replace") if (out / name).exists() else ""
          title, body = read("pr-title.txt").strip()[:200], read("pr-body.md")[:60000]
          summary = ""
          try:
              summary = str(json.loads((temp / "lane-claude.json").read_text()).get("result", ""))[:4000]
          except (OSError, ValueError):
              pass
          forms = set()
          for name in ("SECRET_OAUTH", "SECRET_GITHUB"):
              value = os.environ.get(name, "")
              if value:
                  forms.update({value, value[::-1], base64.b64encode(value.encode()).decode().rstrip("=")})
                  forms.update(value[i:i + 16] for i in range(0, max(len(value) - 15, 1), 4))
          SHAPED = re.compile(r"sk-ant-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}")
          def history():
              # Every commit the bundle publishes, not only the net diff: a token added then removed still counts.
              return git("log", "-p", "-m", "--text", "--no-textconv", "--no-ext-diff", "--format=%H%n%B",
                         base + ".." + head) if head != base else ""
          def live(text):
              return any(len(f) >= 16 and f in text for f in forms)
          # A piece of a real repository secret means the run leaked a live credential: withhold the whole result.
          if live("\n".join([title, body, summary, history()])):
              sys.exit("Lane output contains a credential; result withheld")
          # Text merely shaped like a token (usually a fake test fixture) costs only the lines that carry it.
          removed = {}
          def strip(text, where):
              kept = []
              for line in text.splitlines(keepends=True):
                  if SHAPED.search(line):
                      removed.setdefault(where, set()).add(hashlib.sha256(line.encode()).hexdigest())
                  else:
                      kept.append(line)
              return "".join(kept)
          title, body, summary = strip(title, "PR title"), strip(body, "PR body"), strip(summary, "run summary")
          if head != base and SHAPED.search(history()):
              commits = git("rev-list", "--reverse", "--topo-order", base + ".." + head).split()
              # The run's own commits are the first-parent chain from its head. Anything else in the range, such as
              # main's commits merged in during the run, is never rewritten: if it carries token-shaped text, the
              # rescan below withholds the whole result.
              own = set(git("rev-list", "--first-parent", base + ".." + head).split())
              def tree(rev):
                  entries = {}
                  for item in raw("ls-tree", "-r", "-z", rev).split(b"\0"):
                      if item:
                          meta, path = item.split(b"\t", 1)
                          mode, kind, sha = meta.decode().split()
                          entries[path] = (mode, kind, sha)
                  return entries
              base_tree = tree(base)
              # Content the lane did not write (the base and anything merged in from outside the run) is left alone.
              foreign = {e[2] for e in base_tree.values()}
              for c in commits:
                  if c not in own:
                      foreign.update(e[2] for e in tree(c).values())
              cleaned, mapping = {}, {}
              def clean(sha, path):
                  if sha not in cleaned:
                      data = raw("cat-file", "blob", sha)
                      if not SHAPED.search(data.decode("utf-8", "replace")):
                          cleaned[sha] = sha
                      else:
                          try:
                              text = data.decode("utf-8")
                          except UnicodeDecodeError:
                              cleaned[sha] = None  # A binary file carrying one: keep the base version, or leave it out.
                              removed.setdefault(path, set()).add("binary")
                          else:
                              cleaned[sha] = raw("hash-object", "-w", "--stdin", data=strip(text, path).encode()).decode().strip()
                  return cleaned[sha]
              index = {"GIT_INDEX_FILE": str(temp / "lane-clean.index")}
              for c in commits:
                  if c not in own:
                      mapping[c] = c
                      continue
                  raw("read-tree", c, env=index)
                  updates = []
                  for path, (mode, kind, sha) in tree(c).items():
                      if kind != "blob" or sha in foreign:
                          continue
                      new = clean(sha, path.decode("utf-8", "replace"))
                      if new == sha:
                          continue
                      if new is None:
                          old = base_tree.get(path)
                          updates.append(((old[0] + " " + old[2]) if old else "0 " + "0" * 40).encode() + b"\t" + path)
                      else:
                          updates.append((mode + " " + new).encode() + b"\t" + path)
                  original = git("rev-list", "--parents", "-n", "1", c).split()[1:]
                  parents = [mapping.get(p, p) for p in original]
                  text = raw("cat-file", "commit", c).partition(b"\n\n")[2]
                  message = strip(text.decode("utf-8", "replace"), "commit messages")
                  if not updates and parents == original and message.encode() == text:
                      mapping[c] = c  # A commit with nothing to strip keeps its hash.
                      continue
                  if updates:
                      raw("update-index", "--index-info", data=b"\n".join(updates) + b"\n", env=index)
                  new_tree = git("write-tree", env=index)
                  an, ae, ad, cn, ce, cd = git("log", "-1", "--format=%an%x00%ae%x00%aI%x00%cn%x00%ce%x00%cI", c).split("\0")
                  args = ["commit-tree", new_tree] + [x for p in parents for x in ("-p", p)]
                  mapping[c] = raw(*args, data=message.encode(), env={
                      "GIT_AUTHOR_NAME": an, "GIT_AUTHOR_EMAIL": ae, "GIT_AUTHOR_DATE": ad,
                      "GIT_COMMITTER_NAME": cn, "GIT_COMMITTER_EMAIL": ce, "GIT_COMMITTER_DATE": cd}).decode().strip()
              (temp / "lane-clean.index").unlink(missing_ok=True)
              head = mapping[head]
              raw("update-ref", "refs/heads/lane", head)
          counts = {where: len(lines) for where, lines in sorted(removed.items())}
          if counts:
              note = ("\n\nCredential guard: removed " + str(sum(counts.values())) + " line(s) shaped like a token from: "
                      + ", ".join(counts) + ". The rest of this pass is kept. Restore what those lines did without writing a"
                      " token-shaped string; build fake tokens at runtime.\n")
              note = note if not SHAPED.search(note) else "\n\nCredential guard removed lines shaped like a token.\n"
              body = body[:60000 - len(note)] + note  # The notice always survives the body cap.
          if SHAPED.search("\n".join([title, body, summary, history()])) or live(history()):
              sys.exit("Lane output contains a credential; result withheld")
          if head != base:
              git("bundle", "create", str(pack / "lane.bundle"), "refs/heads/lane", "^" + base)
          (pack / "lane-result.json").write_text(json.dumps({
              "agent_id": os.environ["LANE_AGENT"], "run_id": os.environ["LANE_RUN"], "task": os.environ["LANE_TASK"],
              "branch": os.environ["LANE_BRANCH"], "base": base, "head": head, "pr_title": title, "pr_body": body,
              "claude_outcome": os.environ["CLAUDE_OUTCOME"], "uncommitted": uncommitted,
              "summary": summary, "credential_lines_removed": counts}))
          PY
      - name: Retain lane result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-${{ inputs.run_id }}
          path: ${{ runner.temp }}/lane-pack/
          retention-days: 14
          if-no-files-found: error
      - name: Report run outcome
        if: steps.claude.outcome != 'success'
        run: |
          jq -r '"subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)"' "$RUNNER_TEMP/lane-claude.json" 2>/dev/null || true
          exit 1
