name: Product CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  supervisor:
    name: Supervisor tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - run: sh scripts/ci/test-supervisor.sh
      - run: go test ./internal/settings/ ./internal/bootstrap/ ./internal/domain/ ./internal/repository/ ./cmd/core/
      - run: sh scripts/ci/test-bootstrap.sh
      - run: sh scripts/ci/test-core-image-gate.sh
      - run: sh scripts/ci/pending-gate.sh
      - run: python3 scripts/ci/check-compose.py
      - run: sh scripts/ci/ui-qc.sh
      - run: sh scripts/ci/update-load.sh

  postgres:
    name: Backup integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres_b:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - name: Install Postgres 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Restore synthetic rows
        env:
          TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu?sslmode=disable
          TOGAVSU_TEST_DATABASE_URL_B: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5433/togavsu?sslmode=disable
          TOGAVSU_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          TOGAVSU_PSQL: /usr/lib/postgresql/17/bin/psql
        run: sh scripts/ci/test-backup-integration.sh

  image:
    name: Supervisor image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose -f compose.yaml config >/dev/null
      - name: Build supervisor image
        run: docker build -f Dockerfile -t togavsu-supervisor:local .
      - name: SFTP client is in the supervisor image
        run: docker run --rm --entrypoint /bin/sh togavsu-supervisor:local -c 'command -v sftp >/dev/null'
      - name: Core image
        run: sh scripts/ci/build-core-image.sh
      - name: Core image smoke
        run: sh scripts/ci/test-core-smoke.sh

  api:
    name: API bootstrap validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate API bootstrap
        run: |
          if [ ! -d api ]; then
            echo "API not yet integrated; validation pending"
            exit 0
          fi
          if [ ! -f api/requirements-dev.txt ] || [ ! -f api/check.sh ]; then
            echo "API tree is present but api/requirements-dev.txt or api/check.sh is absent" >&2
            exit 1
          fi
          python -m pip install -r api/requirements-dev.txt
          sh api/check.sh

  core:
    name: Core tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - name: Core tests and first run on one Compose up
        run: |
          sh scripts/ci/test-core.sh
          sh scripts/ci/test-compose-first-run.sh

  api-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - name: API contract tests
        run: sh scripts/ci/test-api.sh

  qa:
    # Runs in the QA image built from scripts/ci/qa-image, which already holds tesseract, its
    # English data and the DejaVu fonts; see qa-bootstrap.yml for how the image is cached.
    name: QA harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the QA image from its recipe, reusing GitHub's layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/ci/qa-image
          load: true
          tags: togavsu-qa:local
          cache-from: type=gha,scope=togavsu-qa
          cache-to: type=gha,mode=max,scope=togavsu-qa
      - name: QA harness tests
        run: docker run --rm -v "$PWD:/src" -w /src togavsu-qa:local sh scripts/ci/test-qa.sh

  full-acceptance:
    name: Full acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres_b:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu?sslmode=disable
      TOGAVSU_TEST_DATABASE_URL_B: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5433/togavsu?sslmode=disable
      TOGAVSU_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      TOGAVSU_PSQL: /usr/lib/postgresql/17/bin/psql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acceptance script present
        if: hashFiles('scripts/ci/full-acceptance.sh') == ''
        run: echo "::notice::scripts/ci/full-acceptance.sh is not on this commit yet (it lands with the core release), so there is nothing to run."
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: hashFiles('scripts/ci/full-acceptance.sh') != ''
        with:
          go-version: "1.22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: hashFiles('scripts/ci/full-acceptance.sh') != ''
        with:
          python-version: "3.12"
      - name: Install Postgres 17 client
        if: hashFiles('scripts/ci/full-acceptance.sh') != ''
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Full acceptance (all 52 criteria and every release gate)
        if: hashFiles('scripts/ci/full-acceptance.sh') != ''
        # runner.temp is only available at step level, not in job-level env.
        env:
          TOGAVSU_ACCEPTANCE_OUT: ${{ runner.temp }}/acceptance
        run: sh scripts/ci/full-acceptance.sh
      - name: Acceptance results
        if: always() && hashFiles('scripts/ci/full-acceptance.sh') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-acceptance
          path: ${{ runner.temp }}/acceptance
