name: QA bootstrap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    # Builds the QA image only when its recipe changes; every other run reuses the stored image,
    # so QA never downloads packages from Ubuntu's servers.
    name: QA image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.name.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Name the image after its recipe
        id: name
        run: |
          sum=$(cat scripts/ci/qa-image/Dockerfile scripts/ci/qa-image/mirrors.txt | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/charitonmedia/togavsu-qa:$sum" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub's container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and store the image if this recipe has none yet
        env:
          REF: ${{ steps.name.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Reusing $REF"
            exit 0
          fi
          docker build -t "$REF" scripts/ci/qa-image
          docker push "$REF"
  harness:
    name: QA bootstrap tests
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Detect QA scaffold
        id: scaffold
        run: |
          if [ -d tests/harness ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "QA scaffold pending; this infrastructure check accepts no product criterion."
          fi
      - name: Confirm OCR and font tools from the QA image
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          tesseract --version
          tesseract --list-langs | grep -x eng
          test -d /usr/share/fonts/truetype/dejavu
      - name: Create clean Python environment
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          python3 -m venv /tmp/togavsu-qa-venv
          /tmp/togavsu-qa-venv/bin/python -m pip install -r tests/requirements-dev.txt
      - name: Run harness unit and OCR regression tests
        if: steps.scaffold.outputs.ready == 'true'
        run: /tmp/togavsu-qa-venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify generated maps and pending acceptance
        if: steps.scaffold.outputs.ready == 'true'
        run: /tmp/togavsu-qa-venv/bin/python -m tests.harness
