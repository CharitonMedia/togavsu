# Scratch runner: the release candidate's three phase subset runs on the product tree
# of this branch's parent commit (the commit under test), checked out detached so the
# runs record that revision on a clean tree. Not part of the product. Delete this
# branch after the run.
name: Scratch release acceptance
on:
  push:
    branches: ['claude/scratch-acceptance-*']
permissions:
  contents: read
jobs:
  full-acceptance:
    name: Release subset acceptance (scratch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres_b:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu?sslmode=disable
      TOGAVSU_TEST_DATABASE_URL_B: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5433/togavsu?sslmode=disable
      TOGAVSU_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      TOGAVSU_PSQL: /usr/lib/postgresql/17/bin/psql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check out the commit under test
        run: git checkout --detach HEAD~1 && git status --porcelain && git rev-parse HEAD
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Postgres 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Phase subset runs (release assignment phase_acceptance)
        env:
          OUT: ${{ runner.temp }}/acceptance
        run: |
          set -u
          mkdir -p "$OUT"
          python3 -c 'import json;t=json.load(open("docs/build/tasks.json"));t=t["tasks"] if isinstance(t,dict) else t;r=next(x for x in t if x["id"]=="release");[print(k, ",".join(v)) for k,v in r["phase_acceptance"].items()]' > "$OUT/phases.txt"
          fail=0
          while read -r phase ids; do
            echo "::group::$phase"
            TOGAVSU_ACCEPTANCE_OUT="$OUT/$phase" TOGAVSU_ACCEPTANCE_IDS="$ids" sh scripts/ci/full-acceptance.sh </dev/null
            code=$?
            echo "::endgroup::"
            echo "$code" > "$OUT/$phase.exit"
            cp "$OUT/$phase/results.json" "$OUT/$phase.json" || true
            echo "$phase exit $code"
            [ "$code" = 0 ] || fail=1
          done < "$OUT/phases.txt"
          exit $fail
      - name: Acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-subset-acceptance
          path: ${{ runner.temp }}/acceptance
