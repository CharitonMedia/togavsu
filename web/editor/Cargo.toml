# Togavsu's editor wrapper (PRD 8.20): LawCraft's wordcraft-web app with the
# wordcraft-law and wordcraft-law-ui add-in installed and turned on, and the Togavsu host
# bridge additions. build.sh copies this folder into a LawCraft checkout at the pinned
# commit as apps/togavsu-editor, so every LawCraft crate and LawCraft's own Cargo.lock
# are used as they are at that commit; LawCraft's repository is not changed.
[package]
name = "togavsu-editor"
description = "LawCraft in the browser for Togavsu (eframe web runner, WebGPU with WebGL2 fallback)"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[[bin]]
name = "togavsu-editor"
path = "src/main.rs"

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-law = { workspace = true }
wordcraft-law-ui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Event", "EventTarget", "BeforeUnloadEvent", "ClipboardEvent", "DataTransfer", "FileList", "File", "DomStringList", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "MediaQueryList", "Storage", "MessageEvent", "UrlSearchParams"] }
