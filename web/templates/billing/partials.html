{{define "subnav"}}<nav class="tabs" aria-label="Billing">
{{- range $t := tabs}}
  <a href="{{$t.Path}}"{{if on $t $.Path}} class="active" aria-current="page"{{end}}>{{$t.Label}}</a>
{{- end}}
</nav>{{end}}
{{define "csrf"}}<input type="hidden" name="csrf" value="{{.}}">{{end}}
{{define "history"}}
<details class="card history">
<summary>Edit history</summary>
<div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>Role</th><th>Field</th><th>Old</th><th>New</th><th>Kind</th><th>Note</th></tr></thead>
<tbody>{{range .}}<tr><td class="nowrap">{{.When}}</td><td>{{.Who}}</td><td>{{.Role}}</td><td>{{.Field}}</td><td class="clip">{{.Old}}</td><td class="clip">{{.New}}</td><td>{{.Kind}}</td><td class="clip">{{.Note}}</td></tr>{{else}}<tr><td colspan="8" class="muted">No changes recorded.</td></tr>{{end}}</tbody></table></div>
</details>
{{end}}
