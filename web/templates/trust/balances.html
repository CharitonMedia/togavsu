{{template "subnav" .}}
<p><a href="/api/v1/reports/trust-balances?format=csv">Download CSV</a></p>
<table>
<thead><tr><th>Client</th><th>Matter</th><th class="num">Balance</th></tr></thead>
<tbody>
{{range .Balances}}
<tr><td>{{index . "client"}}</td><td><a href="/trust/matters/{{index . "matter_id"}}">{{index . "matter"}}</a></td><td class="num">{{index . "balance"}}</td></tr>
{{else}}<tr><td colspan="3">No trust balances.</td></tr>{{end}}
</tbody>
</table>
