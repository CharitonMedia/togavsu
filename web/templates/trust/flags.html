{{template "subnav" .}}
<p class="filters"><a href="/trust/flags?status=open">Open</a> · <a href="/trust/flags?status=resolved">Resolved</a> · <a href="/trust/flags">All</a></p>
<table>
<thead><tr><th>Raised</th><th>Matter</th><th>Scope</th><th class="num">Balance</th><th>Status</th></tr></thead>
<tbody>
{{range .Flags}}
<tr><td>{{date .CreatedAt}}</td><td><a href="/trust/flags/{{.ID}}">{{flagLabel $.Labels .ID}}</a></td><td>{{.Scope}}</td><td class="num debit">{{money .BalanceCents}}</td><td>{{.Status}}</td></tr>
{{else}}<tr><td colspan="5">No trust flags.</td></tr>{{end}}
</tbody>
</table>
